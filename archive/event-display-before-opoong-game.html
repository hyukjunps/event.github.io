<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>풍산고 행사 안내 디스플레이</title>
<meta name="description" content="풍산고 행사 빔프로젝터용 급식·학사일정·시간·행사명 순환 표시 시스템" />
<meta name="theme-color" content="#2563eb" />
<style>
:root{
  --accent:#2563eb;
  --accent2:#60a5fa;
  --bg:#eef6ff;
  --text:#0f172a;
  --muted:#64748b;
  --line:rgba(148,163,184,.30);
  --shadow:0 24px 72px rgba(15,23,42,.14);
  --danger:#ef4444;
  --meal-font:46px;
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",Roboto,Arial,sans-serif;
  color:var(--text);
  background:
    radial-gradient(900px 480px at 8% 0%,color-mix(in srgb,var(--accent2) 35%,transparent),transparent 62%),
    radial-gradient(900px 520px at 95% 8%,color-mix(in srgb,var(--accent) 18%,transparent),transparent 65%),
    linear-gradient(180deg,#f8fbff,var(--bg));
  word-break:keep-all;
}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;
  background-image:linear-gradient(rgba(37,99,235,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(37,99,235,.045) 1px,transparent 1px);
  background-size:54px 54px;
  mask-image:linear-gradient(to bottom,rgba(0,0,0,.45),transparent 80%);
}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}
.app{position:relative;width:100vw;height:100vh;z-index:1}
.display-shell{
  width:100%;height:100%;position:relative;overflow:hidden;
  background:linear-gradient(135deg,rgba(255,255,255,.84),rgba(255,255,255,.48));
  box-shadow:var(--shadow);backdrop-filter:blur(22px);
}
.display-shell::after{
  content:"";position:absolute;right:-130px;top:-130px;width:390px;height:390px;border-radius:120px;
  background:linear-gradient(135deg,color-mix(in srgb,var(--accent2) 50%,transparent),transparent);
  transform:rotate(18deg);opacity:.75;pointer-events:none;
}
.slide{
  position:absolute;inset:0;
  padding:clamp(42px,5vw,88px) clamp(40px,5.2vw,96px);
  display:grid;grid-template-columns:minmax(0,1fr);align-content:center;
  opacity:0;transform:translateY(20px) scale(.982);filter:blur(6px);
  transition:opacity 1.05s ease,transform 1.05s cubic-bezier(.16,1,.3,1),filter 1.05s ease;
  z-index:2;pointer-events:none;
}
.slide.active{opacity:1;transform:translateY(0) scale(1);filter:blur(0);z-index:3;pointer-events:auto}
.slide-title{
  margin:0;font-size:clamp(58px,8.4vw,140px);line-height:.98;letter-spacing:-5px;font-weight:1000;max-width:1320px;
}
.slide-subtitle{
  margin:24px 0 0;color:var(--muted);font-size:clamp(22px,2.4vw,42px);line-height:1.45;font-weight:850;max-width:1200px;
}
.meta{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.pill{
  display:inline-flex;align-items:center;padding:9px 14px;border-radius:999px;background:rgba(255,255,255,.66);
  border:1px solid var(--line);color:var(--muted);font-weight:900;font-size:14px;backdrop-filter:blur(12px);
}
.big-list{margin:30px 0 0;display:grid;gap:14px;max-width:1280px}
.big-item{
  display:flex;align-items:flex-start;gap:16px;padding:18px 22px;border-radius:26px;
  background:rgba(255,255,255,.62);border:1px solid var(--line);box-shadow:0 16px 34px rgba(15,23,42,.07);
  font-size:clamp(24px,2.8vw,46px);line-height:1.28;font-weight:950;min-width:0;
}
.big-item::before{
  content:"";flex:0 0 14px;width:14px;height:14px;border-radius:999px;margin-top:.55em;background:var(--accent);
  box-shadow:0 0 0 8px color-mix(in srgb,var(--accent) 12%,transparent);
}

/* 급식 화면: 한 끼를 하나의 큰 카드로 보여주고, 메뉴 자체는 자연스럽게 줄바꿈 */
.slide[data-slide="meal"]{
  align-content:stretch;
  grid-template-rows:auto auto minmax(0,1fr);
  padding:clamp(28px,3.4vw,54px) clamp(34px,4.8vw,88px);
  min-height:0;
}
.slide[data-slide="meal"] .slide-title{
  font-size:clamp(50px,6.5vw,104px);line-height:.98;letter-spacing:-4px;
}
.slide[data-slide="meal"] .meal-meta{margin-top:8px}
.slide[data-slide="meal"] .big-list{
  margin-top:14px;max-width:none;min-height:0;height:100%;overflow:hidden;
  display:grid;gap:12px;align-items:stretch;
}
.slide[data-slide="meal"] .big-item{
  min-height:0;height:100%;padding:clamp(18px,2.2vw,34px);border-radius:clamp(24px,2.4vw,36px);
  font-size:var(--meal-font);line-height:1.22;align-items:stretch;overflow:hidden;
}
.slide[data-slide="meal"] .big-item::before{display:none}
.meal-card-inner{
  width:100%;height:100%;min-height:0;display:grid;grid-template-rows:auto minmax(0,1fr);gap:clamp(12px,1.5vw,22px);
}
.meal-type{
  color:var(--accent);font-size:.48em;font-weight:1000;line-height:1.15;
  padding-bottom:clamp(8px,.8vw,14px);border-bottom:1px solid color-mix(in srgb,var(--accent) 14%,var(--line));
}
.meal-menu-wrap{
  width:100%;height:100%;min-height:0;
  display:flex;flex-wrap:wrap;align-content:center;align-items:center;justify-content:flex-start;
  gap:clamp(12px,1.7vh,22px) clamp(20px,2.5vw,44px);
  overflow:hidden;
}
.meal-menu-wrap span{
  display:inline-flex;align-items:center;white-space:normal;line-height:1.22;font-weight:950;
}
.meal-menu-wrap span::before{
  content:"";width:.23em;height:.23em;border-radius:50%;background:var(--accent);margin-right:.34em;flex:0 0 auto;
}

.clock-wrap{display:grid;gap:18px}
.clock-time{font-size:clamp(86px,15vw,226px);line-height:.9;letter-spacing:-9px;font-weight:1000;color:var(--text)}
.clock-date{font-size:clamp(28px,3.4vw,56px);color:var(--muted);font-weight:950}
.event-grid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(300px,.85fr);gap:clamp(24px,4vw,70px);align-items:center}
.event-photo{
  width:100%;aspect-ratio:4/3;border-radius:42px;overflow:hidden;border:1px solid var(--line);
  background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 10%,white),rgba(255,255,255,.54));
  box-shadow:0 24px 60px rgba(15,23,42,.12);display:grid;place-items:center;
}
.event-photo img{width:100%;height:100%;object-fit:cover;display:block}
.event-photo .empty{padding:24px;text-align:center;color:var(--muted);font-weight:950;font-size:24px;line-height:1.5}

.modal-back{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:18px;background:rgba(15,23,42,.45);backdrop-filter:blur(16px)}
.modal{width:min(960px,100%);max-height:min(92vh,900px);overflow:auto;border:1px solid var(--line);border-radius:34px;background:rgba(255,255,255,.94);box-shadow:0 40px 120px rgba(15,23,42,.32)}
.modal-head{position:sticky;top:0;z-index:2;padding:22px 24px;display:flex;align-items:flex-start;justify-content:space-between;gap:14px;background:rgba(255,255,255,.9);backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}
.modal-head h1{margin:0;font-size:28px;letter-spacing:-1px}.modal-head p{margin:6px 0 0;color:var(--muted);font-weight:800;line-height:1.55}
.close-btn,.ghost-btn,.primary-btn,.danger-btn{border:0;border-radius:18px;padding:13px 16px;font-weight:1000}
.close-btn,.ghost-btn{background:#fff;border:1px solid var(--line);color:var(--text)}
.primary-btn{color:white;background:linear-gradient(135deg,var(--accent),color-mix(in srgb,var(--accent) 72%,#020617))}
.danger-btn{color:#fff;background:linear-gradient(135deg,var(--danger),#991b1b)}
.modal-body{padding:22px 24px 26px;display:grid;gap:16px}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.field{padding:14px;border-radius:24px;background:rgba(248,250,252,.88);border:1px solid var(--line)}.field.full{grid-column:1/-1}
.field label{display:block;font-size:13px;color:var(--muted);font-weight:1000;margin-bottom:8px}
.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);border-radius:16px;min-height:48px;padding:12px 13px;background:#fff;color:var(--text);font-weight:850;outline:none}
.field textarea{min-height:94px;resize:vertical;line-height:1.6}.field small{display:block;margin-top:8px;color:var(--muted);line-height:1.55;font-weight:750}
.actions{display:flex;flex-wrap:wrap;gap:10px;justify-content:flex-end;margin-top:4px}.preview-img{margin-top:10px;max-height:160px;border-radius:18px;max-width:100%;display:none;border:1px solid var(--line)}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:70;padding:13px 16px;border-radius:999px;background:rgba(15,23,42,.88);color:#fff;font-weight:900;box-shadow:0 20px 60px rgba(0,0,0,.24);opacity:0;pointer-events:none;transition:.25s}
.toast.show{opacity:1;bottom:38px}

@media (max-width:900px){.event-grid{grid-template-columns:1fr}.event-photo{display:none}.form-grid{grid-template-columns:1fr}}
@media (max-width:640px){
  .slide{padding:46px 22px}.slide-title{font-size:clamp(44px,14vw,82px);letter-spacing:-3px}
  .slide[data-slide="meal"]{padding:22px 18px}.slide[data-slide="meal"] .slide-title{font-size:clamp(38px,11vw,64px)}
  .slide[data-slide="meal"] .big-item{padding:14px 16px}.meal-menu-wrap{gap:9px 18px}
}
</style>
</head>
<body>
<div class="app">
  <main class="display-shell" aria-live="polite">
    <section class="slide active" data-slide="event">
      <div class="event-grid">
        <div>
          <h1 class="slide-title" id="eventTitle">행사명을 입력하세요</h1>
          <p class="slide-subtitle" id="eventMessage">관리자 설정을 저장하면 빔프로젝터용 화면이 시작됩니다.</p>
        </div>
        <div class="event-photo" id="eventPhotoBox"><div class="empty">사진을 넣으면<br>이곳에 크게 표시됩니다.</div></div>
      </div>
    </section>

    <section class="slide" data-slide="meal">
      <h1 class="slide-title" id="mealTitle">오늘의 급식</h1>
      <div class="meta meal-meta" id="mealMeta"></div>
      <div class="big-list" id="mealList"><div class="big-item">급식 정보를 불러오는 중입니다.</div></div>
    </section>

    <section class="slide" data-slide="schedule">
      <h1 class="slide-title" id="scheduleTitle">오늘의 학사일정</h1>
      <div class="meta" id="scheduleMeta"></div>
      <div class="big-list" id="scheduleList"><div class="big-item">학사일정을 불러오는 중입니다.</div></div>
    </section>

    <section class="slide" data-slide="clock">
      <div class="clock-wrap"><div class="clock-time" id="clockTime">00:00</div><div class="clock-date" id="clockDate">-</div></div>
    </section>
  </main>
</div>

<div class="modal-back" id="adminModal">
  <section class="modal" role="dialog" aria-modal="true" aria-labelledby="adminTitle">
    <div class="modal-head">
      <div><h1 id="adminTitle">행사 표시 설정</h1><p>저장하면 행사명·급식·학사일정·현재 시간이 설정한 간격으로 순환됩니다.</p></div>
      <button class="close-btn" id="closeAdminBtn" type="button">닫기</button>
    </div>
    <div class="modal-body">
      <div class="form-grid">
        <div class="field full"><label for="inputEventName">행사 이름</label><input id="inputEventName" type="text" placeholder="예: 풍산고 진로 탐구 발표회" /></div>
        <div class="field full"><label for="inputEventMessage">행사 안내 문구</label><textarea id="inputEventMessage" placeholder="예: 발표 순서를 기다리는 동안 오늘의 학교 정보를 확인하세요."></textarea></div>
        <div class="field"><label for="inputMealTitle">급식 화면 제목</label><input id="inputMealTitle" type="text" /></div>
        <div class="field"><label for="inputScheduleTitle">학사일정 화면 제목</label><input id="inputScheduleTitle" type="text" /></div>
        <div class="field full"><label for="inputPhotoEmptyText">사진이 없을 때 표시할 문구</label><input id="inputPhotoEmptyText" type="text" /></div>
        <div class="field"><label for="inputAccent">대표 색상</label><input id="inputAccent" type="color" value="#2563eb" /></div>
        <div class="field"><label for="inputInterval">화면 전환 시간</label><select id="inputInterval"><option value="7000">7초</option><option value="5000">5초</option><option value="10000">10초</option></select></div>
        <div class="field"><label for="inputSchoolName">표시 학교명</label><input id="inputSchoolName" type="text" value="풍산고등학교" /></div>
        <div class="field"><label for="inputAutoFullscreen">전체화면</label><select id="inputAutoFullscreen"><option value="yes">저장할 때 전체화면 요청</option><option value="no">전체화면 요청 안 함</option></select></div>
        <div class="field full"><label for="inputPhoto">행사 사진 / 포스터 선택</label><input id="inputPhoto" type="file" accept="image/*" /><img id="photoPreview" class="preview-img" alt="선택한 이미지 미리보기" /></div>
      </div>
      <div class="actions"><button class="ghost-btn" id="refreshBtn" type="button">자료 다시 불러오기</button><button class="danger-btn" id="clearPhotoBtn" type="button">사진 제거</button><button class="primary-btn" id="saveStartBtn" type="button">저장하고 시작</button></div>
    </div>
  </section>
</div>
<div class="toast" id="toast">저장되었습니다.</div>

<script>
const CONFIG_KEY="opoong_event_display_config_v3";
const API_KEY="c5eac2fb880e4aa185e7957a756dd126";
const ATPT_OFCDC_SC_CODE="R10";
const SD_SCHUL_CODE="8750475";
const SCHEDULE_PROXY_BASE="https://gkrtkdlfwjd.yyhhjj1068-c2c.workers.dev/?ym=";
const MANUAL_SCHEDULE_OVERRIDES={"2026-09-11":["교육과정 박람회"]};
const DEFAULT_CONFIG={
  eventName:"행사명을 입력하세요",
  eventMessage:"잠시 후 행사가 시작됩니다.",
  mealTitle:"오늘의 급식",
  scheduleTitle:"오늘의 학사일정",
  photoEmptyText:"",
  accent:"#2563eb",
  interval:7000,
  schoolName:"풍산고등학교",
  autoFullscreen:"yes",
  photoData:""
};

const $=q=>document.querySelector(q);
const $$=q=>Array.from(document.querySelectorAll(q));
const pad2=n=>String(n).padStart(2,"0");
const ymd=(d=new Date())=>`${d.getFullYear()}${pad2(d.getMonth()+1)}${pad2(d.getDate())}`;
const ym=(d=new Date())=>`${d.getFullYear()}${pad2(d.getMonth()+1)}`;
const isoDate=(d=new Date())=>`${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
const dateKo=(d=new Date())=>new Intl.DateTimeFormat("ko-KR",{dateStyle:"full"}).format(d);
const timeKo=(d=new Date())=>new Intl.DateTimeFormat("ko-KR",{hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:false}).format(d);
const escapeHtml=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
const stripTags=s=>String(s??"").replace(/<br\s*\/?>/gi,"\n").replace(/<[^>]*>/g,"");
const cleanMenuName=s=>stripTags(s).replace(/\s*\((?:\d+\.?)+\)\s*/g," ").replace(/\s+/g," ").trim();

let config=loadConfig();
let activeIndex=0;
let slides=[];
let slideTimer=null;
let wakeLock=null;

function loadConfig(){try{return {...DEFAULT_CONFIG,...JSON.parse(localStorage.getItem(CONFIG_KEY)||"{}")};}catch{return {...DEFAULT_CONFIG};}}
function saveConfig(){localStorage.setItem(CONFIG_KEY,JSON.stringify(config));}
function showToast(text){const t=$("#toast");t.textContent=text;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),1600);}
function applyConfig(){
  document.documentElement.style.setProperty("--accent",config.accent||DEFAULT_CONFIG.accent);
  document.querySelector('meta[name="theme-color"]').setAttribute("content",config.accent||DEFAULT_CONFIG.accent);
  $("#eventTitle").textContent=config.eventName||DEFAULT_CONFIG.eventName;
  $("#eventMessage").textContent=config.eventMessage||DEFAULT_CONFIG.eventMessage;
  $("#mealTitle").textContent=config.mealTitle||DEFAULT_CONFIG.mealTitle;
  $("#scheduleTitle").textContent=config.scheduleTitle||DEFAULT_CONFIG.scheduleTitle;
  const box=$("#eventPhotoBox");
  if(config.photoData) box.innerHTML=`<img src="${config.photoData}" alt="행사 이미지">`;
  else{const text=(config.photoEmptyText||"").trim();box.innerHTML=text?`<div class="empty">${escapeHtml(text)}</div>`:"";}
  $("#inputEventName").value=config.eventName||"";
  $("#inputEventMessage").value=config.eventMessage||"";
  $("#inputMealTitle").value=config.mealTitle||"";
  $("#inputScheduleTitle").value=config.scheduleTitle||"";
  $("#inputPhotoEmptyText").value=config.photoEmptyText||"";
  $("#inputAccent").value=config.accent||DEFAULT_CONFIG.accent;
  $("#inputInterval").value=String(config.interval||7000);
  $("#inputSchoolName").value=config.schoolName||"풍산고등학교";
  $("#inputAutoFullscreen").value=config.autoFullscreen||"yes";
  const prev=$("#photoPreview");
  if(config.photoData){prev.src=config.photoData;prev.style.display="block";}else{prev.removeAttribute("src");prev.style.display="none";}
}
async function neis(endpoint,params){
  const q=new URLSearchParams({KEY:API_KEY,Type:"json",pIndex:"1",pSize:"100",ATPT_OFCDC_SC_CODE,SD_SCHUL_CODE,...params});
  const res=await fetch(`https://open.neis.go.kr/hub/${endpoint}?${q.toString()}`,{cache:"no-store"});
  if(!res.ok) throw new Error(`NEIS HTTP ${res.status}`);
  return await res.json();
}
function readRows(data,endpoint){
  const head=data?.[endpoint]?.[0]?.head;
  const code=head?.[1]?.RESULT?.CODE;
  if(code&&code!=="INFO-000") return [];
  return data?.[endpoint]?.[1]?.row||[];
}

function fitMealToViewport(){
  const slide=document.querySelector('.slide[data-slide="meal"]');
  const list=$("#mealList");
  if(!slide||!list) return;
  let size=Math.min(56,Math.max(30,window.innerWidth*0.031));
  slide.style.setProperty("--meal-font",`${size}px`);
  requestAnimationFrame(()=>{
    let guard=0;
    while(list.scrollHeight>list.clientHeight+2&&size>22&&guard<30){
      size-=1;
      slide.style.setProperty("--meal-font",`${size}px`);
      guard++;
    }
  });
}
async function loadMeal(){
  const today=ymd();
  $("#mealMeta").innerHTML=`<span class="pill">${dateKo()}</span>`;
  try{
    const data=await neis("mealServiceDietInfo",{MLSV_YMD:today});
    const rows=readRows(data,"mealServiceDietInfo");
    if(!rows.length){$("#mealList").innerHTML=`<div class="big-item">오늘 등록된 급식 정보가 없습니다.</div>`;return;}
    $("#mealList").style.gridTemplateRows=`repeat(${rows.length},minmax(0,1fr))`;
    $("#mealList").innerHTML=rows.map(row=>{
      const type=row.MMEAL_SC_NM||"급식";
      const kcal=row.CAL_INFO?` · ${escapeHtml(row.CAL_INFO)}`:"";
      const items=String(row.DDISH_NM||"").replace(/<br\s*\/?>/gi,"\n").split("\n").map(cleanMenuName).filter(Boolean);
      return `<div class="big-item"><div class="meal-card-inner"><div class="meal-type">${escapeHtml(type)}${kcal}</div><div class="meal-menu-wrap">${items.map(item=>`<span>${escapeHtml(item)}</span>`).join("")}</div></div></div>`;
    }).join("");
    fitMealToViewport();
  }catch(err){
    $("#mealList").innerHTML=`<div class="big-item">급식 정보를 불러오지 못했습니다. 인터넷 연결 또는 NEIS API 상태를 확인하세요.</div>`;
    console.warn(err);
  }
}

async function fetchScheduleDirect(){
  const today=ymd();
  const data=await neis("SchoolSchedule",{AA_FROM_YMD:today,AA_TO_YMD:today});
  return readRows(data,"SchoolSchedule").map(row=>row.EVENT_NM||row.EVENT_CNTNT||"").map(v=>String(v).trim()).filter(Boolean);
}
async function fetchScheduleProxy(){
  const res=await fetch(SCHEDULE_PROXY_BASE+encodeURIComponent(ym()),{cache:"no-store"});
  if(!res.ok) throw new Error("학사일정 프록시 오류 HTTP "+res.status);
  const data=await res.json();
  if(!data.ok) throw new Error(data.error||"학사일정 응답 오류");
  const items=data.byDate?.[isoDate()]||[];
  return items.map(it=>typeof it==="string"?it:(it.title||it.EVENT_NM||it.EVENT_CNTNT||"")).map(v=>String(v).trim()).filter(Boolean);
}
async function loadSchedule(){
  const todayIso=isoDate();
  $("#scheduleMeta").innerHTML=`<span class="pill">${dateKo()}</span>`;
  const manual=MANUAL_SCHEDULE_OVERRIDES[todayIso]||[];
  let remote=[];
  let lastError=null;
  try{remote=await fetchScheduleDirect();}
  catch(err){lastError=err;try{remote=await fetchScheduleProxy();}catch(proxyErr){lastError=proxyErr;}}
  const titles=[...new Set([...manual,...remote].map(v=>String(v).trim()).filter(Boolean))];
  if(titles.length){$("#scheduleList").innerHTML=titles.slice(0,6).map(t=>`<div class="big-item">${escapeHtml(t)}</div>`).join("");return;}
  if(lastError){console.warn(lastError);$("#scheduleList").innerHTML=`<div class="big-item">학사일정을 불러오지 못했습니다. NEIS 또는 네트워크 상태를 확인하세요.</div>`;}
  else $("#scheduleList").innerHTML=`<div class="big-item">오늘 등록된 학사일정이 없습니다.</div>`;
}

function updateClock(){const now=new Date();$("#clockTime").textContent=timeKo(now);$("#clockDate").textContent=dateKo(now);}
function showSlide(i){activeIndex=(i+slides.length)%slides.length;slides.forEach((s,idx)=>s.classList.toggle("active",idx===activeIndex));if(slides[activeIndex]?.dataset.slide==="meal") setTimeout(fitMealToViewport,30);}
function startSlideLoop(){slides=$$(".slide");showSlide(activeIndex);clearInterval(slideTimer);slideTimer=setInterval(()=>showSlide(activeIndex+1),Number(config.interval||7000));}
async function refreshData(){await Promise.allSettled([loadMeal(),loadSchedule()]);}
async function requestFullscreenIfNeeded(){if(config.autoFullscreen!=="yes") return;closeAdmin();try{if(!document.fullscreenElement) await document.documentElement.requestFullscreen();}catch{showToast("브라우저가 자동 전체화면을 막았습니다. F 키를 눌러주세요.");}}
async function requestWakeLock(){try{if("wakeLock" in navigator) wakeLock=await navigator.wakeLock.request("screen");}catch(err){console.warn(err);}}
async function openAdmin(){if(document.fullscreenElement){try{await document.exitFullscreen();}catch{}}$("#adminModal").classList.remove("hidden");applyConfig();}
function closeAdmin(){$("#adminModal").classList.add("hidden");}
function readAdminFields(){
  config.eventName=$("#inputEventName").value.trim()||DEFAULT_CONFIG.eventName;
  config.eventMessage=$("#inputEventMessage").value.trim()||DEFAULT_CONFIG.eventMessage;
  config.mealTitle=$("#inputMealTitle").value.trim()||DEFAULT_CONFIG.mealTitle;
  config.scheduleTitle=$("#inputScheduleTitle").value.trim()||DEFAULT_CONFIG.scheduleTitle;
  config.photoEmptyText=$("#inputPhotoEmptyText").value.trim();
  config.accent=$("#inputAccent").value||DEFAULT_CONFIG.accent;
  config.interval=Number($("#inputInterval").value||7000);
  config.schoolName=$("#inputSchoolName").value.trim()||"풍산고등학교";
  config.autoFullscreen=$("#inputAutoFullscreen").value||"yes";
}
function handlePhoto(file){if(!file) return;if(file.size>2.2*1024*1024){alert("이미지가 너무 큽니다. 2MB 이하 이미지로 줄여서 넣어주세요.");return;}const reader=new FileReader();reader.onload=()=>{config.photoData=String(reader.result||"");$("#photoPreview").src=config.photoData;$("#photoPreview").style.display="block";};reader.readAsDataURL(file);}
async function saveAndStart(){readAdminFields();saveConfig();applyConfig();closeAdmin();await requestFullscreenIfNeeded();await requestWakeLock();await refreshData();startSlideLoop();}

$("#closeAdminBtn").addEventListener("click",closeAdmin);
$("#saveStartBtn").addEventListener("click",saveAndStart);
$("#refreshBtn").addEventListener("click",refreshData);
$("#clearPhotoBtn").addEventListener("click",()=>{config.photoData="";$("#photoPreview").style.display="none";$("#photoPreview").removeAttribute("src");showToast("사진이 제거되었습니다.");});
$("#inputPhoto").addEventListener("change",e=>handlePhoto(e.target.files?.[0]));
$("#inputAccent").addEventListener("input",e=>document.documentElement.style.setProperty("--accent",e.target.value));
document.addEventListener("keydown",async e=>{if(e.key.toLowerCase()==="a") openAdmin();if(e.key.toLowerCase()==="f") await requestFullscreenIfNeeded();if(e.key==="ArrowRight") showSlide(activeIndex+1);if(e.key==="ArrowLeft") showSlide(activeIndex-1);});
document.addEventListener("fullscreenchange",()=>{if(document.fullscreenElement) closeAdmin();setTimeout(fitMealToViewport,120);});
document.addEventListener("visibilitychange",async()=>{if(document.visibilityState==="visible"){await requestWakeLock();refreshData();}});
window.addEventListener("resize",()=>setTimeout(fitMealToViewport,80));

applyConfig();
updateClock();
setInterval(updateClock,1000);
refreshData();
setInterval(refreshData,20*60*1000);
startSlideLoop();
openAdmin();
</script>
</body>
</html>
