<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>호르몬 원정대 | O.Poong Game</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Gowun+Dodum&family=IBM+Plex+Sans+KR:wght@400;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: 픽셀 RPG. 상단 상태바 → 게임 화면(캔버스 + 이름표 오버레이) → 터치 조작부. 대화창·배틀·도감은 화면 위에 겹치는 창. 단일 다크 테마. */
:root{
  color-scheme:dark;
  --bg:#120A15; --bg-2:#1C1121; --panel:#26172D; --panel-2:#33203B; --line:#4D3458;
  --ink:#F8EEF1; --muted:#BFA8BF; --vessel:#E3425B; --gold:#F4C350; --gold-ink:#2A1A08;
  --ok:#5BD291; --bad:#FF6E7E;
  --g-brain:#B49CFF; --g-neck:#4ED7D3; --g-pancreas:#83D97F; --g-adrenal:#F6AE48; --g-gonad:#FF8CC1;
  --f-display:"Do Hyeon","Black Han Sans","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-talk:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
body{margin:0}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:16px;line-height:1.55;word-break:keep-all;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-display);font-weight:400;line-height:1.15;text-wrap:balance;margin:0}
p{margin:0}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.muted{color:var(--muted)}
kbd{font-family:var(--f-mono);font-size:12px;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 5px;color:var(--muted)}
.btn{background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:10px 16px;font-weight:700;font-size:15px;cursor:pointer}
.btn:hover:not(:disabled){border-color:var(--ink)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.gold{background:var(--gold);color:var(--gold-ink);border-color:var(--gold)}
.btn.small{padding:5px 11px;font-size:13.5px;border-radius:8px}
.linkish{background:none;border:0;color:var(--muted);text-decoration:underline;text-underline-offset:3px;cursor:pointer;font-size:13.5px;padding:0;text-align:left}

.wrap{max-width:1000px;margin:0 auto;padding-inline:16px;padding-block:12px 24px;display:flex;flex-direction:column;gap:10px}

/* status bar */
.bar{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center}
.who{display:flex;flex-direction:column;line-height:1.2}
.who b{font-family:var(--f-display);font-weight:400;font-size:20px}
.who span{font-size:12.5px;color:var(--gold);font-weight:700}
.xp{display:flex;align-items:center;gap:6px;font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.xp-bar{width:90px;height:7px;border-radius:99px;background:var(--panel-2);overflow:hidden}
.xp-bar div{height:100%;background:var(--gold);transition:width .5s}
.place{flex:1 1 220px;min-width:0}
.place b{font-family:var(--f-display);font-weight:400;font-size:19px;display:block;line-height:1.2}
.place span{font-size:13px;color:var(--muted)}
.bar-r{display:flex;gap:6px;flex-wrap:wrap}

/* stage */
.stage{position:relative;width:min(100%, calc((100vh - 210px) * 1.5385));min-width:min(100%,320px);margin-inline:auto;aspect-ratio:320/208;border:3px solid var(--line);border-radius:8px;overflow:hidden;background:#000;box-shadow:0 0 0 3px #08040a, 0 18px 50px rgba(0,0,0,.5)}
#game{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges;cursor:pointer;touch-action:none}
.tags{position:absolute;inset:0;pointer-events:none}
.tag{position:absolute;transform:translate(-50%,-100%);font-size:clamp(9px,1.25vw,12.5px);font-weight:700;white-space:nowrap;background:rgba(18,10,21,.78);border:1px solid var(--c,var(--line));color:var(--ink);border-radius:5px;padding:0 5px;line-height:1.5}
.tag.area{background:none;border:0;color:rgba(248,238,241,.55);font-family:var(--f-display);font-size:clamp(11px,1.6vw,16px);letter-spacing:.06em;transform:translate(-50%,-50%)}
.tag.mon{border-color:var(--vessel);color:#ffd0d6}
.fade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .22s}
.fade.on{opacity:1}

/* title overlay */
.title{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;gap:12px;padding:clamp(14px,4vw,40px);background:linear-gradient(90deg,rgba(18,10,21,.94) 0%,rgba(18,10,21,.82) 55%,rgba(18,10,21,.25) 100%);overflow:auto}
.title h1{font-size:clamp(40px,8vw,84px);line-height:1}
.title h1 em{font-style:normal;color:var(--vessel)}
.title .sub{font-family:var(--f-display);font-size:clamp(16px,2.4vw,24px);color:var(--gold)}
.title .lede{color:var(--muted);max-width:30em;font-size:clamp(13px,1.6vw,16px)}
.startbox{display:flex;flex-direction:column;gap:8px;max-width:380px}
.startbox input{font:inherit;font-size:16px;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:9px 12px;width:100%}
.startbox .row{display:flex;gap:8px;flex-wrap:wrap}

/* controls */
.controls{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.hint{font-size:13px;color:var(--muted)}
.pad{display:grid;grid-template-columns:repeat(3,52px);grid-template-rows:repeat(2,46px);gap:5px}
.pad button,.abtn{background:var(--panel-2);border:1px solid var(--line);border-radius:10px;font-size:18px;font-weight:700;cursor:pointer;touch-action:none;user-select:none;-webkit-user-select:none}
.pad button:active,.abtn:active{background:var(--line)}
.pad .u{grid-column:2;grid-row:1}.pad .l{grid-column:1;grid-row:2}.pad .d{grid-column:2;grid-row:2}.pad .r{grid-column:3;grid-row:2}
.abtn{width:76px;height:76px;border-radius:50%;background:var(--gold);color:var(--gold-ink);font-family:var(--f-display);font-size:20px;border-color:var(--gold)}
.touch{display:flex;gap:18px;align-items:center}

/* dialog */
.veil{position:fixed;inset:0;background:rgba(6,3,8,.35);z-index:40}
.dlg{position:fixed;left:0;right:0;bottom:0;z-index:41;padding-inline:16px;padding-block:0 calc(14px + env(safe-area-inset-bottom,0px))}
.dlg-box{max-width:900px;margin:0 auto;background:var(--panel-2);border:3px solid var(--line);border-radius:14px;padding:14px 18px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;box-shadow:0 0 0 3px #08040a,0 -10px 40px rgba(0,0,0,.5);cursor:pointer}
.portrait{width:76px;height:76px;image-rendering:pixelated;background:radial-gradient(circle,color-mix(in srgb,var(--c) 28%,transparent),transparent 70%),var(--bg-2);border-radius:10px;border:2px solid var(--c)}
.dlg-name{font-family:var(--f-display);font-size:21px;color:var(--c)}
.dlg-tag{font-size:12.5px;color:var(--muted);margin-left:8px;font-family:var(--f-body)}
.dlg-text{font-family:var(--f-talk);font-size:clamp(16px,2.2vw,19px);line-height:1.65;min-height:3.3em}
.dlg-next{font-size:12.5px;color:var(--muted);text-align:right}
.dlg-next b{color:var(--gold);animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}

/* battle */
.battle{position:fixed;inset:0;z-index:30;background:var(--bg);overflow:auto}
.b-in{max-width:920px;margin:0 auto;padding-inline:16px;padding-block:14px 30px;display:flex;flex-direction:column;gap:12px}
.b-top{display:flex;justify-content:space-between;align-items:flex-end;gap:10px 18px;flex-wrap:wrap}
.b-mon b{font-family:var(--f-display);font-weight:400;font-size:clamp(22px,3.5vw,32px);color:#ffd0d6;display:block;line-height:1.15}
.hpwrap{display:flex;align-items:center;gap:8px;font-family:var(--f-mono);font-size:12px;color:var(--muted);margin-top:4px}
.hp{width:min(260px,52vw);height:12px;border-radius:3px;background:#2a1018;border:2px solid #08040a;overflow:hidden}
.hp div{height:100%;background:linear-gradient(var(--vessel),#b0263c);transition:width .5s}
.hearts{font-size:24px;letter-spacing:3px;color:var(--vessel);line-height:1}
.hearts i{font-style:normal;color:var(--line)}
.arena{position:relative;width:100%;aspect-ratio:320/130;max-height:30vh;border:3px solid var(--line);border-radius:8px;overflow:hidden;box-shadow:0 0 0 3px #08040a;background:#000;margin-inline:auto}
.arena canvas{width:100%;height:100%;image-rendering:pixelated;display:block}
.pop{position:absolute;font-family:var(--f-display);font-size:clamp(22px,4vw,40px);color:var(--gold);text-shadow:0 2px 0 #08040a;animation:popup .9s ease-out forwards;pointer-events:none}
.pop.bad{color:var(--bad)}
@keyframes popup{0%{opacity:0;transform:translateY(10px) scale(.8)}20%{opacity:1;transform:none}100%{opacity:0;transform:translateY(-28px)}}
.msg{background:var(--panel-2);border:3px solid var(--line);border-radius:12px;padding:12px 16px;font-family:var(--f-talk);font-size:clamp(16px,2.2vw,19px);box-shadow:0 0 0 3px #08040a}
.msg.ok{border-color:var(--ok)}.msg.bad{border-color:var(--bad)}
.q{display:flex;flex-direction:column;gap:10px}
.chip{font-size:12px;font-weight:700;border-radius:99px;padding:1px 10px;border:1px solid var(--gold);color:var(--gold);align-self:flex-start}
.quote{font-family:var(--f-talk);font-size:clamp(17px,2.4vw,21px);background:var(--bg-2);border-left:4px solid var(--gold);border-radius:8px;padding:10px 14px}
.qtext{font-size:clamp(17px,2.4vw,21px);font-weight:700}
.opts{display:grid;gap:8px}
@media (min-width:620px){.opts{grid-template-columns:1fr 1fr}}
.opt{display:flex;gap:10px;align-items:center;text-align:left;background:var(--panel);border:2px solid var(--line);border-radius:10px;padding:11px 14px;font-size:16px;font-weight:600;cursor:pointer;min-height:52px}
.opt:hover:not(:disabled){border-color:var(--gold)}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 18%,var(--panel))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 16%,var(--panel))}
.opt.dim{opacity:.45}
.hcard{background:var(--bg-2);border:1px solid var(--line);border-radius:12px;padding:12px 16px}
.hcard .nm{font-family:var(--f-display);font-size:23px}
.abbr{font-family:var(--f-mono);font-size:12px;font-weight:600;color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:0 5px;vertical-align:middle}
dl{display:grid;grid-template-columns:3.4em minmax(0,1fr);gap:3px 10px;margin:6px 0 0;font-size:14.5px}
dt{color:var(--muted);font-weight:600}
dd{margin:0}

/* boss */
.boss-grid{display:grid;gap:12px}
@media (min-width:860px){.boss-grid{grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:start}}
.crisis{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px}
.gauge{display:flex;flex-direction:column;gap:5px;padding-top:24px}
.g-label{font-weight:700;font-size:13.5px;color:var(--muted)}
.g-track{position:relative;height:16px;border-radius:99px;background:var(--bg-2);border:1px solid var(--line)}
.g-band{position:absolute;top:0;bottom:0;background:color-mix(in srgb,var(--ok) 35%,transparent);border-inline:2px solid var(--ok)}
.g-mark{position:absolute;top:-6px;bottom:-6px;width:4px;margin-left:-2px;background:var(--ink);border-radius:2px;transition:left .8s cubic-bezier(.3,1.3,.5,1)}
.g-val{position:absolute;bottom:calc(100% + 4px);left:50%;transform:translateX(-50%);font-family:var(--f-mono);font-weight:600;font-size:14px;white-space:nowrap;background:var(--bad);color:var(--bg);border-radius:5px;padding:0 6px}
.g-mark.good .g-val{background:var(--ok)}
.g-scale{display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:11.5px;color:var(--muted)}
.slots{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.slot{min-width:84px;border:1.5px dashed var(--line);border-radius:8px;padding:4px 8px;font-size:13px;font-weight:600;color:var(--muted);text-align:center}
.slot.full{border-style:solid;border-color:var(--ok);color:var(--ink)}
.hand{background:var(--bg-2);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.hand-grid{display:grid;gap:6px;grid-template-columns:repeat(auto-fill,minmax(120px,1fr))}
.htile{display:flex;gap:6px;align-items:center;text-align:left;background:var(--panel);border:1.5px solid var(--line);border-radius:8px;padding:6px 8px;font-size:13.5px;font-weight:600;cursor:pointer;line-height:1.25;min-width:0}
.htile:hover:not(:disabled){border-color:var(--c)}
.htile.sel{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold);background:var(--panel-2)}
.htile:disabled{opacity:.5;cursor:default}
.dot{width:9px;height:9px;border-radius:50%;background:var(--c);display:inline-block;flex:none}
.dirs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.dirs .btn{padding:12px;font-size:15.5px}

/* modal */
.modal{position:fixed;inset:0;z-index:50;background:rgba(6,3,8,.75);padding:16px;overflow:auto}
.modal-box{max-width:940px;margin:16px auto;background:var(--panel);border:3px solid var(--line);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:14px;box-shadow:0 0 0 3px #08040a}
.modal-head{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.modal-head h2{font-size:30px}
.codex{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.cx{border-radius:12px;border:2px solid var(--line);padding:8px 10px;background:var(--bg-2);text-align:left;cursor:pointer;display:grid;grid-template-columns:40px minmax(0,1fr);gap:8px;align-items:center;min-height:64px}
.cx canvas{width:40px;height:40px;image-rendering:pixelated}
.cx.got{border-color:var(--c)}
.cx .n{font-family:var(--f-display);font-size:17px;line-height:1.15;display:block}
.cx .s{font-size:12px;color:var(--muted);display:block;line-height:1.3}
.cx.lock{cursor:default;opacity:.6}
.cert{border:3px solid var(--gold);border-radius:16px;padding:26px 22px;background:linear-gradient(160deg,rgba(244,195,80,.12),transparent 60%),var(--panel);display:flex;flex-direction:column;gap:12px}
.cert h1{font-size:clamp(36px,6vw,58px);color:var(--gold)}
.cert .whoname{font-family:var(--f-display);font-size:32px}
.cert .body{font-family:var(--f-talk);font-size:17px}
.stats{display:flex;gap:16px;flex-wrap:wrap;font-size:14px;color:var(--muted)}
.stats b{font-family:var(--f-mono);font-size:21px;color:var(--ink)}
.help li{margin-bottom:4px}

.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:60;background:var(--gold);color:var(--gold-ink);font-weight:700;border-radius:10px;padding:9px 16px;box-shadow:0 0 0 3px #08040a,0 8px 30px rgba(0,0,0,.4);max-width:calc(100% - 32px);text-align:center;animation:tpop .25s ease-out}
@keyframes tpop{from{opacity:0;transform:translate(-50%,-8px)}}
.shake{animation:shake .35s}
@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

</head><body>
<main class="wrap">
  <div class="bar" id="bar" hidden>
    <div class="who"><b id="hudName"></b><span id="hudLv"></span></div>
    <div class="xp"><span>XP</span><div class="xp-bar"><div id="xpBar"></div></div><span id="xpTxt"></span></div>
    <div class="place"><b id="hudPlace"></b><span id="hudGoal"></span></div>
    <div class="bar-r">
      <button class="btn small" id="bCodex">카드 도감 <span id="cardCnt"></span></button>
      <button class="btn small" id="bHelp">조작법</button>
      <button class="btn small" id="bSound" aria-pressed="true">소리 켬</button>
    </div>
  </div>

  <div class="stage" id="stage">
    <canvas id="game" width="320" height="208" aria-label="게임 화면. 방향키로 이동하고 Space로 말을 겁니다."></canvas>
    <div class="tags" id="tags"></div>
    <div class="fade" id="fade"></div>
    <div class="title" id="title">
      <p class="muted" style="font-size:13px;font-weight:600;letter-spacing:.08em">생명과학Ⅰ · 항상성과 몸의 조절 · 내분비계 RPG</p>
      <h1>호르몬 <em>원정대</em></h1>
      <p class="sub">불균형 몬스터로부터 몸 왕국을 구하라</p>
      <p class="lede">나노 탐험가가 되어 하모와 함께 몸속을 걸어 다니며 호르몬 주민 18명을 만나고, 지역을 막은 몬스터를 지식으로 물리치세요.</p>
      <div class="startbox" id="startBox"></div>
    </div>
  </div>

  <div class="controls" id="controls" hidden>
    <p class="hint">이동 <kbd>←↑↓→</kbd> 또는 <kbd>WASD</kbd>, 화면 클릭 · 말 걸기 <kbd>Space</kbd> <kbd>Enter</kbd></p>
    <div class="touch">
      <div class="pad" id="pad">
        <button class="u" data-d="up" aria-label="위">▲</button><button class="l" data-d="left" aria-label="왼쪽">◀</button><button class="d" data-d="down" aria-label="아래">▼</button><button class="r" data-d="right" aria-label="오른쪽">▶</button>
      </div>
      <button class="abtn" id="aBtn" aria-label="말 걸기">A</button>
    </div>
  </div>
</main>

<div class="veil" id="veil" hidden></div>
<div class="dlg" id="dlg" hidden>
  <div class="dlg-box" id="dlgBox" tabindex="0" role="dialog" aria-live="polite">
    <canvas class="portrait" id="dlgPic" width="32" height="32"></canvas>
    <div><div class="dlg-name" id="dlgName"></div><p class="dlg-text" id="dlgText"></p><p class="dlg-next"><b>▶</b> 클릭 · Space</p></div>
  </div>
</div>
<div class="battle" id="battle" hidden><div class="b-in" id="bIn"></div></div>
<div class="modal" id="modal" hidden></div>
<div class="toast" id="toast" hidden></div>

<script>
/* ===================== DATA ===================== */
const GL = {hypo:'시상 하부', antp:'뇌하수체 전엽', postp:'뇌하수체 후엽', thyroid:'갑상샘', parathy:'부갑상샘', pancreas:'이자', adrcortex:'부신 겉질', adrmed:'부신 속질', gonad:'생식샘'};
const GLG = {hypo:'brain', antp:'brain', postp:'brain', thyroid:'neck', parathy:'neck', pancreas:'pancreas', adrcortex:'adrenal', adrmed:'adrenal', gonad:'gonad'};
const GCOL = {brain:'#B49CFF', neck:'#4ED7D3', pancreas:'#83D97F', adrenal:'#F6AE48', gonad:'#FF8CC1'};
const SIB = {hypo:'antp', antp:'postp', postp:'antp', thyroid:'parathy', parathy:'thyroid', pancreas:'adrmed', adrcortex:'adrmed', adrmed:'adrcortex', gonad:'antp'};
const H = [

      const vol = kind === 'talk' ? .025 : kind === 'step' ? .015 : (kind === 'bad' || kind === 'hit') ? .05 : .1;

  } catch(e){}
}

function drawSign(c, x, y){ const p = P(c, x, y, 1); p(2, 13, 12, 2, 'rgba(0,0,0,.3)'); p(3, 3, 10, 11, '#8b7fa8'); p(3, 3, 10, 1, '#b8aed0'); p(5, 6, 6, 1, '#4f4470'); p(5, 8, 6, 1, '#4f4470'); p(5, 10, 4, 1, '#4f4470'); p(7, 14, 2, 2, '#6a5f88'); }

    const a = Math.floor(t * 3) % 2, up = ch === 'U';
    p(6, up ? 6 - a : 7 + a, 4, 1, '#f4c350'); p(7, up ? 5 - a : 8 + a, 2, 1, '#f4c350');

}

/* ===================== WORLD ===================== */
let room = ROOMS[S.room];
const ent = {}; // per room computed
function tileAt(x, y){ if (x < 0 || y < 0 || x >= COLS || y >= ROWS) return '#'; return room.map[y][x]; }
const SOLID = new Set(['#', '~', 'T', 'S']);
function monsterHere(){ const id = room.mon; if (!id || S.beaten[id]) return null; return room.bossPos ? {id, ...room.bossPos} : {id, x:10, y:11}; }
function entityAt(x, y){
  const n = room.npcs.find(n => n.x === x && n.y === y); if (n) return {type:'npc', ...n};
  const m = monsterHere(); if (m && m.x === x && m.y === y) return {type:'mon', ...m};
  return null;
}
function blocked(x, y){ return SOLID.has(tileAt(x, y)) || !!entityAt(x, y); }
const DIRS = {up:[0, -1], down:[0, 1], left:[-1, 0], right:[1, 0]};

const PL = {x:S.x, y:S.y, dir:S.dir, moving:false, fx:S.x, fy:S.y, ox:0, oy:0, t:0, path:[], then:null};
const HA = {x:S.x, y:S.y + 1, fx:S.x, fy:S.y + 1, ox:S.x, oy:S.y + 1};
let mode = 'title', held = null, last = performance.now(), T0 = performance.now();
const STEP = 160;

function startMove(dir){
  PL.dir = dir; const [dx, dy] = DIRS[dir], nx = PL.x + dx, ny = PL.y + dy;
  if (blocked(nx, ny)) return false;
  PL.ox = PL.x; PL.oy = PL.y; PL.x = nx; PL.y = ny; PL.moving = true; PL.t = 0;
  HA.ox = HA.x; HA.oy = HA.y; HA.x = PL.ox; HA.y = PL.oy;
  beep('step'); return true;
}
function arrive(){
  PL.moving = false; S.x = PL.x; S.y = PL.y; S.dir = PL.dir; save();
  const ch = tileAt(PL.x, PL.y);
  if (ch === 'D') { PL.path = []; return goRoom(S.room + 1, 10, 1, 'down'); }
  if (ch === 'U') { PL.path = []; return goRoom(S.room - 1, 10, 11, 'up'); }
  if (PL.path.length) { const d = PL.path.shift(); if (!startMove(d)) { PL.path = []; PL.then = null; } return; }
  if (PL.then) { const f = PL.then; PL.then = null; f(); return; }
}
function update(dt){
  if (mode !== 'play') return;
  if (PL.moving) {
    PL.t += dt;
    if (PL.t >= STEP) arrive();
  } else if (PL.path.length) {
    const d = PL.path.shift(); if (!startMove(d)) { PL.path = []; PL.then = null; }
  } else if (held) {
    if (!startMove(held)) PL.dir = held;
  }
}
function render(now){
  const t = (now - T0) / 1000, T = THEMES[room.theme];
  for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) drawTile(ctx, room.map[y][x], x, y, T, t);
  for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) if (room.map[y][x] === 'S') drawSign(ctx, x * TS, y * TS);
  const k = PL.moving ? Math.min(1, PL.t / STEP) : 1;
  const px = (PL.moving ? PL.ox + (PL.x - PL.ox) * k : PL.x) * TS, py = (PL.moving ? PL.oy + (PL.y - PL.oy) * k : PL.y) * TS;
  const hx = (PL.moving ? HA.ox + (HA.x - HA.ox) * k : HA.x) * TS, hy = (PL.moving ? HA.oy + (HA.y - HA.oy) * k : HA.y) * TS;
  const list = [];
  room.npcs.forEach((n, i) => { if (LORE[n.id] && n.id !== 'cmd') return; list.push({y:n.y * TS, d:() => {
    const info = n.id === 'cmd' ? LORE.cmd : HM[n.id];
    const look = Math.abs(PL.x - n.x) > Math.abs(PL.y - n.y) ? (PL.x < n.x ? 'left' : 'right') : (PL.y < n.y ? 'up' : 'down');
    drawBlob(ctx, n.x * TS, n.y * TS - 2, 1, info.col, info.acc, t, i * 1.7, look);
    if (!S.met[n.id]) bubble(n.x * TS, n.y * TS - 14, t);
  }}); });
  room.npcs.forEach(n => { if (LORE[n.id] && n.id !== 'cmd' && !S.met[n.id]) bubble(n.x * TS, n.y * TS - 12, t); });
  const m = monsterHere();
  if (m) list.push({y:m.y * TS + 1, d:() => m.id === 'boss' ? drawMonster(ctx, m.x * TS - 16, m.y * TS - 30, 1.5, MON[m.id], t, false) : drawMonster(ctx, m.x * TS - 8, m.y * TS - 18, 1, MON[m.id], t, false)});
  list.push({y:hy - 1, d:() => drawHamo(ctx, hx, hy - 4, 1, t)});
  const frame = PL.moving ? (k < .5 ? 1 : 2) : 0;
  list.push({y:py, d:() => drawPlayer(ctx, px, py - 2, 1, PL.dir, frame)});
  list.sort((a, b) => a.y - b.y).forEach(o => o.d());
}
function bubble(x, y, t){ const b = Math.sin(t * 6) > 0 ? 0 : 1, p = P(ctx, x, y - b, 1); p(5, 0, 6, 7, '#fff'); p(6, 7, 2, 1, '#fff'); p(7, 1, 2, 3, '#e3425b'); p(7, 5, 2, 1, '#e3425b'); }

function loop(now){
  const dt = Math.min(50, now - last); last = now;
  update(dt); render(now); renderArena(now);
  requestAnimationFrame(loop);
}

  mode = 'battle'; held = null;
  BT = {mon:'boss', room:S.room, boss:true, max:CRISES.length, hp:CRISES.length - (S.bossAt || 0), hearts:5, ci:S.bossAt || 0};
  $('#battle').hidden = false; beep('hit'); loadCrisis();
}
function loadCrisis(){ const c = CRISES[BT.ci]; BT.step = 0; BT.val = c.start; BT.sel = null; BT.solved = false; BT.prev = null; renderCrisis(`카오스의 '${c.title}'! ${c.story}`, 'bad'); }
const pct = (c, v) => Math.max(0, Math.min(100, (v - c.g.min) / (c.g.max - c.g.min) * 100));
const fmt = (c, v) => v.toFixed(c.g.dec);
function renderCrisis(msg, cls){
  const c = CRISES[BT.ci], g = c.g, inBand = BT.val >= g.lo && BT.val <= g.hi, multi = c.steps.length > 1, show = BT.prev ?? BT.val;
  $('#bIn').innerHTML = battleShell(`
    <p class="msg ${cls || ''}" aria-live="polite">${esc(msg)}</p>
    <div class="boss-grid">
      <div class="crisis">
        <p class="muted" style="font-size:13px;font-weight:700">위기 ${BT.ci + 1} / ${CRISES.length} · ${esc(c.title)}</p>
        <div class="gauge"><span class="g-label">${esc(g.label)} 계기판</span>
          <div class="g-track"><div class="g-band" style="left:${pct(c, g.lo)}%;width:${pct(c, g.hi) - pct(c, g.lo)}%"></div>
            <div class="g-mark ${inBand ? 'good' : ''}" id="gMark" style="left:${pct(c, show)}%"><span class="g-val" id="gVal">${fmt(c, show)} ${esc(g.unit)}</span></div></div>
          <div class="g-scale"><span>${fmt(c, g.min)}</span><span style="color:var(--ok)">정상 ${fmt(c, g.lo)}–${fmt(c, g.hi)}</span><span>${fmt(c, g.max)}</span></div></div>
        <p class="qtext" style="font-size:18px">${esc(c.ask)}</p>
        ${multi ? `<div class="slots">${c.steps.map((s, k) => `<span class="slot ${k < BT.step ? 'full' : ''}">${k < BT.step ? esc(HM[s.h].name) + ' ▲' : `${k + 1}번째`}</span>`).join('<span class="muted">→</span>')}</div>` : ''}
        ${BT.solved ? `<button class="btn gold" id="bNext" style="align-self:flex-start">${BT.ci < CRISES.length - 1 ? '다음 위기로' : '카오스에게 마지막 일격!'} <kbd style="color:inherit;border-color:currentColor">Enter</kbd></button>` : `<button class="linkish" id="bHint">하모에게 힌트 듣기</button>`}
      </div>
      <div class="hand">
        <p class="muted" style="font-size:13px;font-weight:700">호르몬 카드 손패</p>
        <div class="hand-grid" id="hand">${H.map(h => `<button class="htile ${BT.sel === h.id ? 'sel' : ''}" data-h="${h.id}" style="--c:${hcol(h)}" ${BT.solved ? 'disabled' : ''}><span class="dot"></span><span>${esc(h.name)}</span></button>`).join('')}</div>
        <p style="font-size:14.5px;min-height:1.5em">${BT.sel ? `선택: <b>${esc(HM[BT.sel].name)}</b> · 분비를 어떻게 할까?` : '카드를 한 장 고르세요.'}</p>
        <div class="dirs"><button class="btn" id="dUp" ${BT.sel && !BT.solved ? '' : 'disabled'}>▲ 분비 증가</button><button class="btn" id="dDown" ${BT.sel && !BT.solved ? '' : 'disabled'}>▼ 분비 감소</button></div>
      </div>
    </div>`);
  if (BT.prev != null) { const to = BT.val; BT.prev = null; requestAnimationFrame(() => requestAnimationFrame(() => { const mk = $('#gMark'); if (!mk) return; mk.style.left = pct(c, to) + '%'; $('#gVal').textContent = `${fmt(c, to)} ${g.unit}`; mk.classList.toggle('good', to >= g.lo && to <= g.hi); })); }
  $('#hand').onclick = e => { const t = e.target.closest('.htile'); if (!t || BT.solved) return; BT.sel = t.dataset.h; beep('tick'); renderCrisis(msg, cls); };
  $('#dUp').onclick = () => playCard('up'); $('#dDown').onclick = () => playCard('down');
  if (BT.solved) { $('#bNext').onclick = nextCrisis; $('#bNext').focus({preventScroll:true}); }
  else $('#bHint').onclick = () => say([['hamo', c.hint]]);
}
function playCard(dir){
  const c = CRISES[BT.ci], s = c.steps[BT.step], h = HM[BT.sel], now = performance.now();
  S.total++;
  if (h.id === s.h && dir === s.dir) {
    S.right++; save(); beep('ok'); BT.beam = now;
    BT.prev = BT.val; BT.val = s.to; BT.step++; BT.sel = null;
    if (BT.step >= c.steps.length) {
      BT.solved = true; BT.hp--; BT.hitT = now; popText('-1 HP'); addXP(25); S.bossAt = BT.ci + 1; save(); beep('hit');
      return renderCrisis(`${c.win} 카오스에게 큰 피해! (+25 XP)`, 'ok');
    }
    return renderCrisis(`${h.name} 분비 ${dir === 'up' ? '증가' : '감소'}! 명령이 다음 단계로 내려간다…`, 'ok');
  }
  save(); beep('bad'); BT.hearts--; BT.hurtT = now; popText('♥ -1', true);
  const g = c.g, away = BT.val > g.hi ? 1 : -1;
  BT.prev = BT.val; BT.val = Math.max(g.min, Math.min(g.max, BT.val + away * (g.max - g.min) * .04));
  let why;
  if (h.id === s.h) why = '카드는 맞았지만 방향이 반대예요!';
  else if (c.steps.some((x, k) => k > BT.step && x.h === h.id)) why = `${h.name}도 필요하지만 아직 순서가 아니에요. 명령은 위에서부터 내려와요.`;
  else why = `${josa(h.name, '은', '는')} '${h.short}' 담당이라 이 위기를 막지 못했다!`;
  BT.sel = null;
  if (BT.hearts <= 0) {
    renderCrisis(why, 'bad');
    setTimeout(() => {
      $('#battle').hidden = true; mode = 'play'; BT = null;
      say([['boss', '크하하! 균형은 무너졌다!'], ['cmd', '탐험가, 일단 물러나게! 카드 도감을 다시 살펴보고, 해결하지 못한 위기부터 다시 도전하게.']], () => {
        Object.assign(PL, {x:10, y:2, dir:'down', moving:false}); Object.assign(HA, {x:10, y:1, ox:10, oy:1}); S.x = 10; S.y = 2; save();
      });
    }, 900);
    return;
  }
  renderCrisis(`카오스의 ${MON.boss.atk}! ${why} ♥ -1`, 'bad');
}
function nextCrisis(){
  BT.ci++;
  if (BT.ci >= CRISES.length) {
    BT.gone = performance.now(); beep('win');
    setTimeout(() => {
      S.beaten.boss = 1; S.done = true; S.bossAt = 0; addXP(60); save();
      $('#battle').hidden = true; mode = 'play'; BT = null; renderTags(); renderHud();
      say([['boss', MON.boss.bye], ['cmd', '해냈군, 탐험가! 몸 왕국의 모든 계기판이 정상 범위로 돌아왔네.'], ['hamo', `${S.name || '탐험가'} 님 덕분이에요! 호르몬들이 서로 협력하고, 때로는 반대로 작용하며 항상성을 지킨다는 걸 직접 확인했어요.`]], showCert);
    }, 800);
    return;
  }
  loadCrisis();
}

/* ===================== MODALS ===================== */
function openModal(html){ const m = $('#modal'); m.innerHTML = `<div class="modal-box" role="dialog">${html}</div>`; m.hidden = false; held = null; const b = m.querySelector('button'); if (b) b.focus(); }
function closeModal(){ $('#modal').hidden = true; }
$('#modal').addEventListener('click', e => { if (e.target.id === 'modal' || e.target.closest('[data-close]')) closeModal(); });
function openCodex(sel){
  const order = ROOMS.flatMap(r => r.npcs.map(n => n.id)).filter(id => HM[id]);
  openModal(`<div class="modal-head"><h2>호르몬 카드 도감 <span class="muted" style="font-family:var(--f-mono);font-size:17px">${Object.keys(S.cards).length}/18</span></h2><button class="btn small" data-close>닫기</button></div>
    ${sel ? hCard(HM[sel]) : '<p class="muted">주민에게 말을 걸면 카드를 받아요. 받은 카드를 누르면 자세한 내용이 보여요.</p>'}
    <div class="codex">${order.map(id => { const h = HM[id], got = S.cards[id];
      return `<button class="cx ${got ? 'got' : 'lock'}" data-h="${id}" style="--c:${hcol(h)}" ${got ? '' : 'disabled'}><canvas width="16" height="16" data-pic="${id}"></canvas><span><span class="s">${got ? esc(h.src) : esc(GL[h.gland])}</span><span class="n">${got ? esc(h.name) : '???'}</span>${got ? `<span class="s">${esc(h.short)}</span>` : ''}</span></button>`; }).join('')}</div>`);
  document.querySelectorAll('[data-pic]').forEach(cn => { const id = cn.dataset.pic, c = cn.getContext('2d'); if (S.cards[id]) drawBlob(c, 0, 0, 1, HM[id].col, HM[id].acc, 0, 0, 'down'); else { c.fillStyle = '#4D3458'; c.fillRect(4, 4, 8, 9); } });
  document.querySelectorAll('.cx.got').forEach(b => b.onclick = () => openCodex(b.dataset.h));
}
function openHelp(){
  openModal(`<div class="modal-head"><h2>조작법과 진행 방법</h2><button class="btn small" data-close>닫기</button></div>
    <ul class="help">
      <li><b>이동</b>: 방향키 또는 WASD. 화면을 클릭(터치)하면 그곳까지 걸어가요. 아래 십자 버튼도 쓸 수 있어요.</li>
      <li><b>말 걸기</b>: 주민을 바라보고 Space / Enter / A 버튼. 주민을 클릭해도 다가가서 말을 걸어요.</li>
      <li><b>진행</b>: 지역의 주민을 모두 만나 카드를 받으면 → 출구를 막은 몬스터와 퀴즈 배틀 → 이기면 아래 출구로 다음 지역!</li>
      <li><b>배틀</b>: 정답을 맞히면 몬스터 HP가 줄어요. 틀리면 ♥가 줄고, 그 문제는 나중에 다시 나와요.</li>
      <li><b>최종 결전</b>: 카오스가 일으킨 위기에 맞는 호르몬 카드를 골라 분비 증가·감소를 정해요.</li>
      <li>진행 상황은 이 브라우저에 자동 저장돼요.</li>
    </ul>
    <button class="linkish" id="resetBtn">처음부터 다시 시작 (기록 삭제)</button>`);
  $('#resetBtn').onclick = e => { const b = e.currentTarget; if (b.dataset.arm) { try { localStorage.removeItem(KEY); } catch(_){} S = fresh(); save(); location.reload(); return; } b.dataset.arm = '1'; b.textContent = '한 번 더 누르면 기록이 삭제됩니다'; };
}
function showCert(){
  const acc = S.total ? Math.round(S.right / S.total * 100) : 0, d = new Date();
  openModal(`<div class="cert">
      <p class="muted" style="font-size:13px;font-weight:600;letter-spacing:.06em">몸 왕국 시상 하부 사령부 발행</p>
      <h1>항상성 수호자 임명장</h1>
      <p class="whoname">${esc(S.name || '탐험가')}</p>
      <p class="body">위 탐험가는 여섯 내분비샘 지역을 탐험하며 호르몬 주민들을 만나 카드를 모으고, 불균형 몬스터 여섯과 항상성 붕괴의 왕 카오스를 물리쳐 몸 왕국의 균형을 되찾았기에 이 임명장을 드립니다.</p>
      <div class="stats"><span>레벨 <b>${level(S.xp) + 1}</b> ${LEVELS[level(S.xp)][1]}</span><span>카드 <b>${Object.keys(S.cards).length}</b>/18</span><span>정답률 <b>${acc}</b>%</span><span>XP <b>${S.xp}</b></span></div>
      <p class="muted">${d.getFullYear()}년 ${d.getMonth() + 1}월 ${d.getDate()}일</p>
    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn gold" data-close>몸속 계속 돌아다니기</button></div>`);
}
$('#bCodex').onclick = () => openCodex();
$('#bHelp').onclick = openHelp;
$('#bSound').onclick = () => { soundOn = !soundOn; try { localStorage.setItem('hq-sound', soundOn ? '1' : '0'); } catch(e){} renderHud(); };

/* ===================== TITLE ===================== */
function renderTitle(){
  const has = S.started;
  $('#startBox').innerHTML = has ? `
    <p><b>${esc(S.name || '탐험가')}</b>의 모험 기록이 있어요 · Lv.${level(S.xp) + 1} · ${ROOMS[S.room].name} · 카드 ${Object.keys(S.cards).length}/18</p>
    <div class="row"><button class="btn gold" id="tCont">이어서 모험하기</button><button class="btn" id="tNew">새로 시작</button></div>` : `
    <label for="nameIn" class="muted" style="font-size:13px;font-weight:600">탐험가 이름</label>
    <input id="nameIn" maxlength="12" placeholder="예: 2학년 3반 김하늘" autocomplete="off">
    <div class="row"><button class="btn gold" id="tGo">모험 시작</button></div>
    <button class="linkish" id="tUnlock">선생님용: 모든 몬스터를 비켜 세우고 시작 (수업 시연용)</button>`;
  if (has) {
    $('#tCont').onclick = () => begin();
    $('#tNew').onclick = e => { const b = e.currentTarget; if (b.dataset.arm) { try { localStorage.removeItem(KEY); } catch(_){} S = fresh(); room = ROOMS[0]; renderTitle(); return; } b.dataset.arm = '1'; b.textContent = '한 번 더 누르면 기록 삭제'; };
  } else {
    const go = unlock => {
      S = fresh(); S.name = $('#nameIn').value.trim() || '탐험가'; S.started = true;
      if (unlock) ['m0','m1','m2','m3','m4','m5'].forEach(m => S.beaten[m] = 1);
      save(); room = ROOMS[0]; Object.assign(PL, {x:9, y:5, dir:'up'}); Object.assign(HA, {x:9, y:6, ox:9, oy:6}); begin();
      if (unlock) setTimeout(() => toast('모든 출구가 열렸어요. 아래로 내려가며 원하는 지역을 시연하세요.'), 600);
    };
    $('#tGo').onclick = () => go(false);
    $('#nameIn').addEventListener('keydown', e => { if (e.key === 'Enter') go(false); });
    $('#tUnlock').onclick = e => { const b = e.currentTarget; if (b.dataset.arm) return go(true); b.dataset.arm = '1'; b.textContent = '한 번 더 누르면 모든 출구가 열린 채로 시작해요'; };
  }
}
function begin(){
  beep('win');
  room = ROOMS[S.room]; Object.assign(PL, {x:S.x, y:S.y, dir:S.dir, moving:false, path:[]});
  HA.x = PL.x; HA.y = PL.y + (blocked(PL.x, PL.y + 1) ? 0 : 1); HA.ox = HA.x; HA.oy = HA.y;
  $('#title').hidden = true; $('#bar').hidden = false; $('#controls').hidden = false;
  mode = 'play'; renderTags(); renderHud();
  if (!S.intro[S.room]) setTimeout(() => say(room.intro, () => { S.intro[S.room] = 1; save(); }), 300);
  setTimeout(() => cv.focus && document.activeElement && document.activeElement.blur(), 0);
}

/* ===================== BOOT ===================== */
room = ROOMS[S.room] || ROOMS[0];
renderTitle(); renderHud();
requestAnimationFrame(loop);
</script>

</body></html>
